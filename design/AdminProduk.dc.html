<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kelola Produk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F0;--line:#E4E1D9;--tx:#17181C;--mu:#62656F;--ac:#F5A524;--acx:#1A1204}
*{box-sizing:border-box}
body{margin:0;background:#F5F4F0;color:#17181C;font-family:'Figtree',system-ui,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.d{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:.06em;color:#F2EFE9}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ac);display:grid;place-items:center;color:var(--acx)}
.side{flex:0 0 252px;background:#0D0E12;padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.sa{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:44px;border-radius:12px;color:#A9ADB9;font-weight:500}
.sa:hover{color:#fff;background:#181B22}
.sa.on{background:var(--ac);color:var(--acx);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid #CFCBC0;background:#fff;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn.ic{min-width:44px;padding:0}
.btn.dg{color:#8F1D1D;border-color:#F3B9B9;background:#FFF7F7}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.lbl{font-size:13px;color:var(--mu);font-weight:500}
.tg{display:inline-flex;align-items:center;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid}
.tg.a{background:#E4F6EA;color:#17653A;border-color:#A9DDBB}
.tg.g{background:#EFEDE7;color:#4A4D57;border-color:#D5D1C5}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:13px;color:var(--mu);font-weight:500}
th,td{padding:12px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.th{width:48px;height:48px;border-radius:12px;background:radial-gradient(120% 90% at 75% 0%,rgba(245,165,36,.4),transparent 55%),linear-gradient(160deg,#272B38,#12141A)}
.th.t2{background:radial-gradient(120% 90% at 20% 0%,rgba(130,160,255,.4),transparent 55%),linear-gradient(160deg,#242838,#12141A)}
.th.t3{background:radial-gradient(120% 90% at 80% 10%,rgba(255,120,150,.35),transparent 55%),linear-gradient(160deg,#2A2530,#13121A)}
.fld{display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--mu);font-weight:500}
.fld input,.fld select,.fld textarea{background:#fff;border:1px solid #CFCBC0;border-radius:12px;padding:11px 14px;color:var(--tx);font:inherit;min-height:46px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1000px">
  <nav class="side" aria-label="Menu admin">
    <a class="brand" href="Main.dc.html" style="padding: 4px 14px 24px"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="6" width="2" height="4" rx="1"/><rect x="5" y="2" width="2" height="12" rx="1"/><rect x="9" y="4" width="2" height="8" rx="1"/><rect x="13" y="7" width="2" height="2" rx="1"/></svg></span>VANTARA</a>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="7">
      <a class="sa {{m.cls}}" href="{{m.href}}"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"/></svg>{{m.label}}</a>
    </sc-for>
    <a class="sa" href="AdminLogin.dc.html" style="margin-top: auto"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2H3v12h3M10 5l3 3-3 3M13 8H6"/></svg>Keluar</a>
  </nav>

  <main style="flex: 999 1 600px; min-width: 0; padding: 36px 44px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
      <div style="flex-grow: 1"><h1 class="d" style="font-size: 36px; font-weight: 800">Kelola Produk</h1><p style="color: var(--mu)">Tambah, ubah, dan hapus produk rental.</p></div>
      <button class="btn p" type="button">+ Tambah Produk</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <div class="card" style="flex: 2 1 480px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
        <div class="fld"><label for="cari">Cari produk</label><input id="cari" type="text" placeholder="Ketik nama produk"></div>
        <div style="overflow-x: auto">
          <table>
            <thead><tr><th>Produk</th><th>Harga / hari</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
                <tr>
                  <td><div style="display: flex; align-items: center; gap: 14px"><span class="th {{r.t}}"></span><div><strong>{{r.nama}}</strong><p style="color: var(--mu); font-size: 13px">{{r.kat}}</p></div></div></td>
                  <td style="white-space: nowrap">{{r.harga}}</td>
                  <td><span class="tg {{r.cls}}">{{r.status}}</span></td>
                  <td><div style="display: flex; gap: 8px">
                    <button class="btn ic" type="button" aria-label="Ubah produk"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 14l1-4 8-8 3 3-8 8zM9.5 3.5l3 3"/></svg></button>
                    <button class="btn ic dg" type="button" aria-label="Hapus produk"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg></button>
                  </div></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
      </div>

      <div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 20px">
        <form class="card" style="display: flex; flex-direction: column; gap: 16px">
          <h2 class="d" style="font-size: 22px">Ubah produk</h2>
          <div class="fld"><label for="np">Nama produk</label><input id="np" type="text" value="Paket Sound System Outdoor"></div>
          <div class="fld"><label for="ds">Deskripsi</label><textarea id="ds" rows="3">Paket sound system untuk acara luar ruangan.</textarea></div>
          <div style="display: flex; gap: 14px; flex-wrap: wrap">
            <div class="fld" style="flex: 1 1 140px"><label for="hg">Harga / hari (Rp)</label><input id="hg" type="number" value="1800000"></div>
            <div class="fld" style="flex: 1 1 140px"><label for="st">Status</label><select id="st"><option>Tersedia</option><option>Tidak tersedia</option></select></div>
          </div>
          <div class="fld"><span>Foto produk</span>
            <div style="display: flex; align-items: center; gap: 14px; border: 1.5px dashed #CFCBC0; border-radius: 12px; padding: 14px"><span class="th"></span><span style="flex-grow: 1; font-size: 14px">foto-produk.jpg</span><button class="btn" type="button">Ganti</button></div>
          </div>
          <div style="display: flex; gap: 10px"><button class="btn p" type="button" style="flex: 1 1 0">Simpan</button><button class="btn" type="button" style="flex: 1 1 0">Batal</button></div>
        </form>
        <div class="card" style="border-color: #F3B9B9; background: #FFF7F7; display: flex; flex-direction: column; gap: 12px">
          <strong style="color: #8F1D1D">Hapus produk ini?</strong>
          <p style="font-size: 14px; color: #5A3030">Data produk akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.</p>
          <div style="display: flex; gap: 10px"><button class="btn dg" type="button">Ya, hapus</button><button class="btn" type="button">Batal</button></div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['Dashboard','AdminDashboard.dc.html','M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z'],
      ['Produk','AdminProduk.dc.html','M2 5l6-3 6 3v6l-6 3-6-3zM2 5l6 3 6-3M8 8v6'],
      ['Booking','AdminBooking.dc.html','M3 3h10a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM2 7h12M5 1.5v3M11 1.5v3'],
      ['Transaksi','AdminTransaksi.dc.html','M2 5h10l-2.5-2.5M14 11H4l2.5 2.5'],
      ['Invoice','AdminTransaksi.dc.html','M4 2h8v12l-2-1-2 1-2-1-2 1zM6 6h4M6 9h4'],
      ['Laporan Bulanan','AdminLaporan.dc.html','M2 14V8M6 14V4M10 14V9M14 14V2'],
      ['Profil Admin','AdminDashboard.dc.html','M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2.5 14c.6-3 3-4 5.5-4s4.9 1 5.5 4']
    ];
    return {
      menu: items.map(([label, href, d]) => ({ label, href, d, cls: label === 'Produk' ? 'on' : '' })),
      rows: [
        { nama: 'Paket Sound System Outdoor', kat: 'Sound System', harga: 'Rp 1.800.000', status: 'Tersedia', cls: 'a', t: '' },
        { nama: 'Lighting Panggung Set', kat: 'Professional Lighting', harga: 'Rp 950.000', status: 'Tersedia', cls: 'a', t: 't2' },
        { nama: 'Wireless Mic Set', kat: 'Sound System', harga: 'Rp 250.000', status: 'Tersedia', cls: 'a', t: 't3' },
        { nama: 'Mixer Digital 16 Channel', kat: 'Sound System', harga: 'Rp 400.000', status: 'Tersedia', cls: 'a', t: 't2' },
        { nama: 'Moving Head Light', kat: 'Professional Lighting', harga: 'Rp 600.000', status: 'Tidak tersedia', cls: 'g', t: '' },
        { nama: 'Videobooth 360°', kat: 'Videobooth 360°', harga: 'Rp 1.100.000', status: 'Tersedia', cls: 'a', t: 't3' }
      ]
    };
  }
}
</script>
</body>
</html>
