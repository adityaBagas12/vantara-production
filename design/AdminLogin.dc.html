<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Login Admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F0;--line:#E4E1D9;--tx:#17181C;--mu:#62656F;--ac:#F5A524;--acx:#1A1204}
*{box-sizing:border-box}
body{margin:0;background:#F5F4F0;color:#17181C;font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.55}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}
.d{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;letter-spacing:.06em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ac);display:grid;place-items:center;color:var(--acx)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:12px;border:1px solid #CFCBC0;background:#fff;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn.p:hover{filter:brightness(1.06)}
.fld{display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--mu);font-weight:500}
.fld input{background:#fff;border:1px solid #CFCBC0;border-radius:12px;padding:12px 14px;color:var(--tx);font:inherit;min-height:48px;width:100%}
.fld input:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px">
  <div style="flex: 1 1 520px; background: radial-gradient(90% 70% at 80% 0%, rgba(245,165,36,.30), transparent 60%), linear-gradient(160deg,#1F2330,#0D0E12); color: #F2EFE9; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
    <span class="brand"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="6" width="2" height="4" rx="1"/><rect x="5" y="2" width="2" height="12" rx="1"/><rect x="9" y="4" width="2" height="8" rx="1"/><rect x="13" y="7" width="2" height="2" rx="1"/></svg></span>VANTARA</span>
    <div>
      <h1 class="d" style="font-size: 56px; line-height: 1.04; font-weight: 800; max-width: 460px">Kelola rental, tanpa catatan berserakan.</h1>
      <p style="margin-top: 18px; font-size: 18px; color: #A9ADB9; max-width: 420px">Produk, booking, transaksi, invoice, dan laporan bulanan dalam satu panel.</p>
    </div>
    <p style="color: #A9ADB9; font-size: 14px">Vantara Production · Kota Bengkulu</p>
  </div>
  <div style="flex: 1 1 480px; display: grid; place-items: center; padding: 48px 32px">
    <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px">
      <div><h2 class="d" style="font-size: 36px; font-weight: 800">Masuk Admin</h2><p style="color: var(--mu); margin-top: 6px">Gunakan akun admin Vantara Production.</p></div>
      <div class="fld"><label for="u">Username</label><input id="u" type="text" autocomplete="username"></div>
      <div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
      <div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: #FDECEC; border: 1px solid #F3B9B9; color: #8F1D1D; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="flex: none"><circle cx="9" cy="9" r="7.5"/><path d="M9 5v5M9 12.5v.5"/></svg>
        Login gagal. Periksa kembali username dan password.
      </div>
      <a class="btn p" href="AdminDashboard.dc.html">Masuk</a>
      <a href="Main.dc.html" style="color: var(--mu); text-align: center; text-decoration: underline; min-height: 44px; display: grid; place-items: center">← Kembali ke website</a>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
